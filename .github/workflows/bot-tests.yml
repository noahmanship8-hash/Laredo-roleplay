name: Discord bot tests
on:
  push:
    paths: ['bot/**', '.github/workflows/bot-tests.yml']
  pull_request:
    paths: ['bot/**', '.github/workflows/bot-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm test
