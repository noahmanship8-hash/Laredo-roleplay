name: Update announcements

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-announcements
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch announcements from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.ANNOUNCEMENTS_CHANNEL_ID }}
        run: node scripts/fetch-announcements.mjs

      # The site is served from public/, so this is the file Cloudflare deploys.
      # Checking the old root path (announcements.json) meant the job always decided
      # "No new announcements" and never committed anything.
      - name: Save changes
        run: |
          FILE=public/announcements.json
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing - the fetch step did not write it."
            exit 1
          fi
          if git diff --quiet -- "$FILE"; then
            echo "No new announcements."
            exit 0
          fi
          git config user.name "laredo-announcements-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Update announcements"
          git push
          echo "Committed the new announcements."
