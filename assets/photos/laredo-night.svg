    <rect x="526" y="382" width="148" height="76" rx="5" fill="#17332f" stroke="#c19a62" stroke-opacity=".7" stroke-width="3"/>
    <rect x="792" y="382" width="148" height="76" rx="5" fill="#38271e" stroke="#c19a62" stroke-opacity=".7" stroke-width="3"/>
    <text x="334" y="413" fill="#f2d9aa" font-size="15" letter-spacing="3">LAREDO</text>
    <text x="334" y="439" fill="#e8c07f" font-size="12" letter-spacing="2">NORTHBOUND</text>
    <text x="600" y="413" fill="#f2d9aa" font-size="15" letter-spacing="3">CHECKPOINT</text>
    <text x="600" y="439" fill="#e8c07f" font-size="12" letter-spacing="2">OPEN LANE</text>
    <text x="866" y="413" fill="#f2d9aa" font-size="15" letter-spacing="3">PUENTE</text>
    <text x="866" y="439" fill="#e8c07f" font-size="12" letter-spacing="2">SOUTHBOUND</text>
  </g>
  <g filter="url(#glow)">
