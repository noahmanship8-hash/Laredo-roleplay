<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Laredo at night</title>
  <desc id="desc">A stylized Texas border crossing at night, with the bridge lights leading toward the city.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#111926"/>
      <stop offset=".48" stop-color="#20212a"/>
      <stop offset=".78" stop-color="#895032"/>
      <stop offset="1" stop-color="#e9a351"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".66" cy=".58" r=".48">
      <stop stop-color="#f5b45e" stop-opacity=".78"/>
      <stop offset=".48" stop-color="#d56d36" stop-opacity=".27"/>
      <stop offset="1" stop-color="#d56d36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asphalt" x2="0" y2="1">
      <stop stop-color="#37353a"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </linearGradient>
    <linearGradient id="beam" x2="0" y2="1">
      <stop stop-color="#606069"/>
      <stop offset="1" stop-color="#272a31"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#horizon)"/>
  <ellipse cx="765" cy="530" rx="430" ry="85" fill="#f0a74f" opacity=".35" filter="url(#soft)"/>

  <g fill="#111820" opacity=".76">
    <path d="M0 445h80v-45h33v45h48v-71h45v71h48v-34h29v34h57v-58h51v58h46v-91h50v91h38v-47h39v47h54v-63h48v63h41v-39h33v39h57v-70h53v70h48v-48h44v48h61v-54h54v64H0z"/>
    <path d="M0 462h1200v56H0z" opacity=".46"/>
  </g>
  <g fill="#e9a351" opacity=".62">
    <path d="M98 413h6v8h-6zm94-19h7v10h-7zm181 17h7v9h-7zm153-43h7v11h-7zm126 25h7v10h-7zm203-31h7v11h-7zm142 24h7v10h-7z"/>
  </g>

  <path d="M0 512 1200 500v50L0 565z" fill="#17191f"/>
  <path d="M0 545 1200 530v16L0 562z" fill="#f0a64c" opacity=".26"/>

  <path d="M0 900 474 500h249L1200 900z" fill="url(#asphalt)"/>
  <path d="m0 900 490-400h18L125 900z" fill="#d59045" opacity=".28"/>
  <path d="m1200 900-490-400h-18l383 400z" fill="#d59045" opacity=".25"/>
  <path d="m596 506 8 0 14 394h-30z" fill="#f4cb7b" opacity=".88"/>
  <path d="m558 615 34-2-5 28-34 2zM529 733l52-3-7 43-52 3zM492 862l74-5-7 43h-79z" fill="#e9a351" opacity=".8"/>
  <path d="m210 900 277-397 5 0L312 900zM994 900 715 503h-5l182 397z" fill="#f2b457" opacity=".12"/>

  <g stroke="#5d5148" stroke-width="9" fill="none" opacity=".78">
